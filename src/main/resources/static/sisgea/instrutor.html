<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISGEA - Instrutores</title>
  <link rel="stylesheet" href="css/adicionar.css">
  <link rel="stylesheet" href="css/sweetalert.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <div class="sidebar">
    <a href="inicio.html" id="inicial">
      <h1><img src="css/aviao.png" alt="Logo do Avião">SISGEA</h1>
    </a>
    <a href="agendamento.html">Agendamento</a>
    <a href="aeronave.html">Aeronave</a>
    <a href="aluno.html">Aluno</a>
    <a href="instrutor.html">Instrutor</a>
    <a href="manutencao.html">Manutenção</a>
    <a href="diario.html">Diário</a>
  </div>

  <div class="main">
    <a class="add-button" href="adicionarinstrutor.html">+</a>

    <h1>Lista de Instrutores</h1>

    <div class="filtros">
      <label>Filtrar por nome:</label>
      <input type="text" id="filtro-nome" placeholder="Digite o nome" oninput="aplicarFiltros()">

      <label>Filtrar por CPF:</label>
      <input type="text" id="filtro-cpf" placeholder="Digite o CPF" oninput="aplicarFiltros()">

      <label>Filtrar por CANAC:</label>
      <input type="text" id="filtro-canac" placeholder="Digite o CANAC" oninput="aplicarFiltros()">

      <label>Filtrar por Status:</label>
      <select id="filtro-status" onchange="aplicarFiltros()">
        <option value="ativos">Somente Ativos</option>
        <option value="inativos">Somente Inativos</option>
        <option value="todos">Todos</option>
      </select>
    </div>
    <br><br>

    <div class="container" id="lista-instrutores">
      <ul id="instrutores-list"></ul>
    </div>
  </div>

  <script>
    // Lista instrutores
    let instrutoresCarregados = [];

    // Formata CPF no padrão xxx.xxx.xxx-xx
    function formatarCPF(cpf) {
      if (!cpf) return "N/A";
      return cpf.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4");
    }

    // Carrega instrutores do backend
    async function carregarInstrutores() {
      try {
        const response = await fetch("http://localhost:8080/api/instrutores/todos");
        if (!response.ok) throw new Error("Erro ao buscar instrutores");

        instrutoresCarregados = await response.json();
        aplicarFiltros();
      } catch (error) {
        console.error(error);
        document.getElementById("instrutores-list").innerHTML = "<li>Erro ao carregar instrutores.</li>";
      }
    }

    // Aplica filtros aos instrutores carregados
    function aplicarFiltros() {
      const filtroNome = document.getElementById("filtro-nome").value.toLowerCase();
      const filtroCPF = document.getElementById("filtro-cpf").value.replace(/\D/g, "");
      const filtroCANAC = document.getElementById("filtro-canac").value.toLowerCase();
      const filtroStatus = document.getElementById("filtro-status").value;

      const lista = document.getElementById("instrutores-list");
      lista.innerHTML = "";

      let filtrados = instrutoresCarregados.filter(instrutor => {
        const nome = instrutor.nome?.toLowerCase() || "";
        const cpf = instrutor.cpf?.replace(/\D/g, "") || "";
        const canac = instrutor.canac ? instrutor.canac.toString().toLowerCase() : "";
        const ativo = instrutor.ativo === true;

        if (filtroNome && !nome.includes(filtroNome)) return false;
        if (filtroCPF && !cpf.includes(filtroCPF)) return false;
        if (filtroCANAC && !canac.includes(filtroCANAC)) return false;

        if (filtroStatus === "ativos" && !ativo) return false;
        if (filtroStatus === "inativos" && ativo) return false;

        return true;
      });

      if (filtrados.length === 0) {
        lista.innerHTML = "<li>Nenhum instrutor encontrado.</li>";
        return;
      }

      filtrados.forEach(instrutor => {
        const item = document.createElement("li");
        item.innerHTML = `
        <span>${instrutor.nome || "Sem nome"} - CPF: ${formatarCPF(instrutor.cpf) || "N/A"} - CANAC: ${instrutor.canac || "Sem CANAC"} - ${(instrutor.ativo ? "Ativo" : "Inativo")}</span>
        <div class="list-buttons">
          <button onclick="editarInstrutor('${instrutor.cpf}')">Editar</button>
          ${instrutor.ativo
            ? `<button onclick="deletarInstrutor('${instrutor.cpf}')">Excluir</button>`
            : `<button onclick="recuperarInstrutor('${instrutor.cpf}')">Recuperar</button>`
          }
        </div>
      `;
        lista.appendChild(item);
      });
    }

    // Redireciona para a página de edição do instrutor
    function editarInstrutor(cpf) {
      window.location.href = `adicionarinstrutor.html?cpf=${cpf}`;
    }

    // Deleta um instrutor com confirmação
    async function deletarInstrutor(cpf) {
      Swal.fire({
        title: 'Tem certeza?',
        text: "O instrutor será removido e você não poderá reverter esta ação!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#c00',
        cancelButtonColor: '#555',
        confirmButtonText: 'Sim, excluir',
        cancelButtonText: 'Cancelar'
      }).then(async (result) => {
        if (result.isConfirmed) {
          try {
            const response = await fetch(`http://localhost:8080/api/instrutores/${cpf}`, { method: "DELETE" });
            if (response.ok) {
              Swal.fire('Excluído!', 'O instrutor foi removido com sucesso.', 'success');
              carregarInstrutores();
            } else {
              Swal.fire('Erro', 'Não foi possível excluir o instrutor.', 'error');
            }
          } catch (error) {
            console.error(error);
            Swal.fire('Erro', 'Falha de conexão com o servidor.', 'error');
          }
        }
      });
    }

    // Recupera instrutor (seta ativo = true)
    async function recuperarInstrutor(cpf) {
      try {
        const response = await fetch(`http://localhost:8080/api/instrutores/${cpf}`);
        if (!response.ok) throw new Error("Erro ao buscar instrutor");
        const instrutor = await response.json();

        instrutor.ativo = true;

        const update = await fetch(`http://localhost:8080/api/instrutores/${cpf}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            cpf: instrutor.cpf,
            nome: instrutor.nome,
            telefone: instrutor.telefone,
            email: instrutor.email,
            habilitacao: instrutor.habilitacao,
            canac: instrutor.canac,
            endereco: instrutor.endereco,
            usuario: instrutor.usuario,
            ativo: instrutor.ativo
          })
        });

        if (update.ok) {
          Swal.fire("Sucesso", "Instrutor recuperado com sucesso!", "success")
            .then(() => carregarInstrutores());
        } else {
          Swal.fire("Erro", "Não foi possível recuperar o instrutor.", "error");
        }
      } catch (err) {
        console.error(err);
        Swal.fire("Erro", "Falha de conexão com o servidor.", "error");
      }
    }




    carregarInstrutores();
  </script>

</body>

</html>
