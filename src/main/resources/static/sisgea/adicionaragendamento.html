<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SISGEA - Cadastro de Agendamento</title>
  <link rel="stylesheet" href="css/adicionar.css" />
  <link rel="stylesheet" href="css/sweetalert.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <div class="sidebar">
    <a href="inicio.html" id="inicial">
      <h1><img src="css/aviao.png" alt="Logo do Avião"
          style="height:28px; vertical-align:middle; margin-right:8px;">SISGEA</h1>
    </a>
    <a href="agendamento.html">Agendamento</a>
    <a href="aeronave.html">Aeronave</a>
    <a href="aluno.html">Aluno</a>
    <a href="instrutor.html">Instrutor</a>
    <a href="manutencao.html">Manutenção</a>
    <a href="diario.html">Diário</a>
  </div>

  <div class="main">
    <h1 id="titulo">Cadastro de Agendamento</h1>

    <div class="container" id="agendamento">
      <label>Instrutor</label>
      <select id="instrutorSelect">
        <option value="">Carregando instrutores...</option>
      </select>

      <label>Aluno</label>
      <select id="alunoSelect">
        <option value="">Carregando alunos...</option>
      </select>

      <label>Aeronave</label>
      <select id="aeronaveSelect">
        <option value="">Carregando aeronaves...</option>
      </select>

      <label>Partida (data e horário)</label>
      <input type="datetime-local" id="dataAgendamento">

      <label>Retorno (data e horário)</label>
      <input type="datetime-local" id="retorno">

      <label>Origem (local)</label>
      <input type="text" id="partida" placeholder="Ex: SBDO - Dourados" maxlength="4" oninput="caixaAlta(this)">

      <label>Destino (local)</label>
      <input type="text" id="destino" placeholder="Ex: SBCG - Campo Grande" maxlength="4" oninput="caixaAlta(this)">

      <label>Tipo de Voo</label>
      <select id="tipoVoo">
        <option value="">Selecione o tipo de voo</option>
        <option value="VFR-D">VFR-D</option>
        <option value="VFR-N">VFR-N</option>
        <option value="IFR">IFR</option>
        <option value="SIM">SIM</option>
      </select>

      <input type="hidden" id="status" value="Agendado">

      <button class="btn" id="btnCadastrar">Cadastrar Agendamento</button>
    </div>
  </div>

  <script>
    const baseUrl = 'http://localhost:8080/api';
    const urlParams = new URLSearchParams(window.location.search);
    const agendamentoId = urlParams.get('id'); // id para edição
    const instrutorSelect = document.getElementById('instrutorSelect');
    const alunoSelect = document.getElementById('alunoSelect');
    const aeronaveSelect = document.getElementById('aeronaveSelect');
    const dataAgendamentoInput = document.getElementById('dataAgendamento');
    const retornoInput = document.getElementById('retorno');
    const partidaInput = document.getElementById('partida');
    const destinoInput = document.getElementById('destino');
    const tipoVooSelect = document.getElementById('tipoVoo');
    const statusInput = document.getElementById('status');
    const btnCadastrar = document.getElementById('btnCadastrar');

    function formatarData(dateStr) {
      const date = new Date(dateStr);
      const pad = n => n.toString().padStart(2, '0');
      const ano = date.getFullYear();
      const mes = pad(date.getMonth() + 1);
      const dia = pad(date.getDate());
      const hora = pad(date.getHours());
      const min = pad(date.getMinutes());
      return `${ano}-${mes}-${dia}T${hora}:${min}`;
    }


    function caixaAlta(input) {
      input.value = input.value.toUpperCase();
      aplicarFiltros();
    }

    // Carrega lista de itens
    async function carregarDados(url, selectElem, valueField, textFields, placeholder) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('Erro ao carregar ' + placeholder);
        const data = await res.json();
        selectElem.innerHTML = '<option value="">' + placeholder + '</option>';
        data.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item[valueField];
          const label = textFields.map(f => item[f]).filter(Boolean).join(" - ");
          opt.textContent = label;
          selectElem.appendChild(opt);
        });
      } catch (err) {
        selectElem.innerHTML = '<option value="">' + placeholder + ' (erro)</option>';
        console.error(err);
      }
    }

    // Carrega dados iniciais
    carregarDados(baseUrl + '/aeronaves', aeronaveSelect, 'matricula', ['matricula', 'fabricante', 'modelo'], 'Selecione a Aeronave');
    carregarDados(baseUrl + '/alunos', alunoSelect, 'cpf', ['canac', 'nome'], 'Selecione o Aluno');
    carregarDados(baseUrl + '/instrutores', instrutorSelect, 'cpf', ['canac', 'nome'], 'Selecione o Instrutor');

    // Função para carregar agendamento para edição
    async function carregarAgendamento(id) {
      try {
        const res = await fetch(`${baseUrl}/agendamentos/${id}`);
        if (!res.ok) throw new Error("Agendamento não encontrado");
        const ag = await res.json();

        document.getElementById('titulo').innerText = "Editar Agendamento";
        btnCadastrar.innerText = "Atualizar Agendamento";

        instrutorSelect.value = ag.instrutor.cpf;
        alunoSelect.value = ag.aluno.cpf;
        aeronaveSelect.value = ag.aeronave.matricula;
        dataAgendamentoInput.value = formatarData(ag.horario_partida);
        retornoInput.value = formatarData(ag.horario_retorno);
        partidaInput.value = ag.partida;
        destinoInput.value = ag.destino;
        tipoVooSelect.value = ag.tipo_voo;
        statusInput.value = ag.status || "Agendado";
      } catch (err) {
        Swal.fire("Erro", "Não foi possível carregar o agendamento.\n" + err, "error");
        console.error(err);
      }
    }

    if (agendamentoId) carregarAgendamento(agendamentoId);

    // Cadastrar ou atualizar agendamento
    async function salvarAgendamento(forcar = false) {
      const ag = {
        aeronave: { matricula: aeronaveSelect.value },
        aluno: { cpf: alunoSelect.value },
        instrutor: { cpf: instrutorSelect.value },
        partida: partidaInput.value.trim(),
        destino: destinoInput.value.trim(),
        tipo_voo: tipoVooSelect.value,
        status: statusInput.value,
        horario_partida: new Date(dataAgendamentoInput.value).toISOString(),
        horario_retorno: new Date(retornoInput.value).toISOString()
      };

      // Validações
      if (!ag.aeronave.matricula || !ag.aluno.cpf || !ag.instrutor.cpf) {
        Swal.fire("Atenção", "Aluno, Instrutor e Aeronave são obrigatórios.", "warning");
        return;
      }
      if (!dataAgendamentoInput.value || !retornoInput.value) {
        Swal.fire("Atenção", "Informe horários de partida e retorno.", "warning");
        return;
      }
      if (new Date(ag.horario_retorno) < new Date(ag.horario_partida)) {
        Swal.fire("Atenção", "O retorno deve ser igual ou posterior à partida.", "warning");
        return;
      }

      const method = agendamentoId ? "PUT" : "POST";
      const url = agendamentoId ? `${baseUrl}/agendamentos/${agendamentoId}?forcar=${forcar}` : `${baseUrl}/agendamentos?forcar=${forcar}`;

      try {
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(ag)
        });
        const body = await res.json();

        if (!res.ok) {
          Swal.fire("Erro", body.error || "Falha ao salvar agendamento.", "error");
          return;
        }

        if (body.warn) {
          Swal.fire({
            title: "Atenção",
            text: body.warn + "\n\n- Deseja forçar mesmo assim?",
            icon: "warning",
            showCancelButton: true,
            confirmButtonText: "Forçar",
            cancelButtonText: "Cancelar"
          }).then(async result => {
            if (result.isConfirmed) salvarAgendamento(true);
          });
          return;
        }

        Swal.fire("Sucesso", agendamentoId ? "Agendamento atualizado com sucesso!" : "Agendamento criado com sucesso!", "success")
          .then(() => window.location.href = "agendamento.html");

      } catch (err) {
        Swal.fire("Erro", "Não foi possível conectar à API.\n" + err, "error");
        console.error(err);
      }
    }

    btnCadastrar.addEventListener('click', () => salvarAgendamento());
  </script>
</body>

</html>
