<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISGEA - Cadastro de Manutenção</title>
  <link rel="stylesheet" href="css/adicionar.css">
  <link rel="stylesheet" href="css/sweetalert.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <div class="sidebar">
    <a href="inicio.html" id="inicial">
      <h1><img src="css/aviao.png" alt="Logo do Avião">SISGEA</h1>
    </a>
    <a href="agendamento.html">Agendamento</a>
    <a href="aeronave.html">Aeronave</a>
    <a href="aluno.html">Aluno</a>
    <a href="instrutor.html">Instrutor</a>
    <a href="manutencao.html">Manutenção</a>
    <a href="diario.html">Diário</a>
  </div>

  <div class="main">
    <h1 id="titulo">Cadastro de Manutenção</h1>
    <div class="container" id="manutencao">

      <label>Aeronave</label>
      <select id="aeronave">
        <option value="">Carregando aeronaves...</option>
      </select>

      <label>Descrição</label>
      <input type="text" id="descricao" placeholder="Descrição da manutenção" maxlength="128">

      <label>Data Estimada</label>
      <input type="date" id="dataEstimada">

      <label>Status</label>
      <select id="status">
        <option value="">Selecione...</option>
        <option>Concluída</option>
        <option>Em andamento</option>
        <option>Pendente</option>
      </select>

      <button id="botao" onclick="cadastrarManutencao()">Cadastrar Manutenção</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const manutencaoId = urlParams.get('id');
    const aeronaveSelect = document.getElementById("aeronave");

    if (manutencaoId) carregarManutencao(manutencaoId);

    // Carrega aeronaves disponíveis
    async function carregarAeronaves(selecionar = "") {
      try {
        const res = await fetch("http://localhost:8080/api/aeronaves");
        if (!res.ok) throw new Error("Erro ao buscar aeronaves");
        const aeronaves = await res.json();
        aeronaveSelect.innerHTML = "<option value=''>Selecione...</option>";
        aeronaves.forEach(a => {
          const opt = document.createElement("option");
          opt.value = a.matricula;
          opt.textContent = `${a.matricula} - ${a.modelo}`;
          if (a.matricula === selecionar) opt.selected = true;
          aeronaveSelect.appendChild(opt);
        });
        // Bloqueia select apenas se estiver editando
        if (manutencaoId) aeronaveSelect.disabled = true;
      } catch (err) {
        aeronaveSelect.innerHTML = "<option value=''>Erro ao carregar aeronaves</option>";
        console.error(err);
      }
    }

    // Cadastra ou atualiza uma manutenção
    async function cadastrarManutencao(forcar = false) {
      const manutencao = {
        descricao: document.getElementById("descricao").value.trim(),
        data_est_man: document.getElementById("dataEstimada").value,
        status: document.getElementById("status").value.trim(),
        aeronave: { matricula: aeronaveSelect.value }
      };

      if (!manutencao.descricao || !manutencao.data_est_man || !manutencao.status || !manutencao.aeronave.matricula) {
        Swal.fire("Atenção", "Preencha todos os campos obrigatórios!", "warning");
        return;
      }

      const method = manutencaoId ? "PUT" : "POST";
      const endpoint = manutencaoId
        ? `http://localhost:8080/api/manutencoes/${manutencaoId}?forcar=${forcar}`
        : `http://localhost:8080/api/manutencoes?forcar=${forcar}`;

      try {
        const res = await fetch(endpoint, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(manutencao)
        });

        const data = await res.text();

        if (!res.ok) {
          Swal.fire("Erro", data, "error");
          return;
        }

        if (data.startsWith("AVISO") && !forcar) {
          Swal.fire({
            title: "Atenção",
            text: data.replace("AVISO:\n", ""),
            icon: "warning",
            showCancelButton: true,
            confirmButtonText: "Confirmar mesmo assim",
            cancelButtonText: "Cancelar"
          }).then(result => {
            if (result.isConfirmed) cadastrarManutencao(true);
          });
          return;
        }

        Swal.fire("Sucesso", manutencaoId ? "Manutenção atualizada com sucesso!" : "Manutenção cadastrada com sucesso!", "success")
          .then(() => window.location.href = "manutencao.html");

      } catch (error) {
        Swal.fire("Erro", "Não foi possível conectar à API.", "error");
        console.error(error);
      }
    }

    // Carrega dados da manutenção para edição
    async function carregarManutencao(id) {
      try {
        const res = await fetch(`http://localhost:8080/api/manutencoes/${id}`);
        if (!res.ok) throw new Error("Manutenção não encontrada");
        const m = await res.json();

        document.getElementById("titulo").innerText = "Edição de Manutenção";
        document.getElementById("botao").innerText = "Atualizar Manutenção";

        document.getElementById("descricao").value = m.descricao || "";
        document.getElementById("dataEstimada").value = m.data_est_man || "";
        document.getElementById("status").value = m.status || "";

        await carregarAeronaves(m.aeronave?.matricula || "");

      } catch (error) {
        Swal.fire("Erro", "Não foi possível carregar os dados da manutenção.", "error");
        console.error(error);
      }
    }

    carregarAeronaves();
  </script>
</body>
</html>
