<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISGEA - Agendamentos</title>
  <link rel="stylesheet" href="css/adicionar.css">
  <link rel="stylesheet" href="css/sweetalert.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <div class="sidebar">
    <a href="inicio.html" id="inicial">
      <h1><img src="css/aviao.png" alt="Logo do Avião">SISGEA</h1>
    </a>
    <a href="agendamento.html">Agendamento</a>
    <a href="aeronave.html">Aeronave</a>
    <a href="aluno.html">Aluno</a>
    <a href="instrutor.html">Instrutor</a>
    <a href="manutencao.html">Manutenção</a>
    <a href="diario.html">Diário</a>
  </div>

  <div class="main">
    <a class="add-button" href="adicionaragendamento.html">+</a>

    <h1>Lista de Agendamentos de Voo</h1>

    <div class="filtros">
      <label>Data Início:</label>
      <input type="date" id="filtro-data-inicio" onchange="aplicarFiltros()">

      <label>Data Fim:</label>
      <input type="date" id="filtro-data-fim" onchange="aplicarFiltros()">

      <label>Aluno:</label>
      <select id="filtro-aluno" onchange="aplicarFiltros()">
        <option value="">Todos</option>
      </select>

      <label>Instrutor:</label>
      <select id="filtro-instrutor" onchange="aplicarFiltros()">
        <option value="">Todos</option>
      </select>

      <label>Aeronave:</label>
      <select id="filtro-aeronave" onchange="aplicarFiltros()">
        <option value="">Todas</option>
      </select>

      <label>Tipo de Voo:</label>
      <select id="filtro-tipo-voo" onchange="aplicarFiltros()">
        <option value="">Todos</option>
        <option value="VFR-D">VFR-D</option>
        <option value="VFR-N">VFR-N</option>
        <option value="IFR">IFR</option>
        <option value="SIM">SIM</option>
      </select>
    </div>
    <br><br>

    <div class="container" id="lista-agendamentos">
      <ul id="agendamentos-list"></ul>
    </div>
  </div>

  <script>
    // Lista agendamentos, alunos, instrutores e aeronaves
    let agendamentosCarregados = [];
    let alunosCarregados = [];
    let instrutoresCarregados = [];
    let aeronavesCarregadas = [];

    function formatarDataHoraLocal(dateString) {
            if (!dateString) return "";
            const d = new Date(dateString);
            const hasTZ = /Z$|[+\-]\d{2}:\d{2}$/.test(dateString);
            const ano = hasTZ ? d.getUTCFullYear() : d.getFullYear();
            const mes = (hasTZ ? d.getUTCMonth() : d.getMonth()) + 1;
            const dia = hasTZ ? d.getUTCDate() : d.getDate();
            const hora = hasTZ ? d.getUTCHours() : d.getHours();
            const minuto = hasTZ ? d.getUTCMinutes() : d.getMinutes();
            return `${String(dia).padStart(2, "0")}/${String(mes).padStart(2, "0")}/${ano} - ${String(hora).padStart(2, "0")}:${String(minuto).padStart(2, "0")}`;
        }

    // Carrega agendamentos do backend
    async function carregarAgendamentos() {
      try {
        const response = await fetch("http://localhost:8080/api/agendamentos");
        if (!response.ok) throw new Error("Erro ao buscar agendamentos");
        agendamentosCarregados = await response.json();
        aplicarFiltros();
      } catch (error) {
        console.error(error);
        document.getElementById("agendamentos-list").innerHTML = "<li>Erro ao carregar agendamentos.</li>";
      }
    }

    // Carrega alunos do backend
    async function carregarAlunos() {
      try {
        const response = await fetch("http://localhost:8080/api/alunos");
        if (!response.ok) throw new Error("Erro ao buscar alunos");
        alunosCarregados = await response.json();
        const selectAluno = document.getElementById("filtro-aluno");
        alunosCarregados.forEach(a => {
          const option = document.createElement("option");
          option.value = a.cpf;
          option.textContent = a.nome;
          selectAluno.appendChild(option);
        });
      } catch (error) {
        console.error(error);
      }
    }


    // Carrega instrutores do backend
    async function carregarInstrutores() {
      try {
        const response = await fetch("http://localhost:8080/api/instrutores");
        if (!response.ok) throw new Error("Erro ao buscar instrutores");
        instrutoresCarregados = await response.json();
        const selectInstrutor = document.getElementById("filtro-instrutor");
        instrutoresCarregados.forEach(i => {
          const option = document.createElement("option");
          option.value = i.cpf;
          option.textContent = i.nome;
          selectInstrutor.appendChild(option);
        });
      } catch (error) {
        console.error(error);
      }
    }

    // Carrega aeronaves do backend
    async function carregarAeronaves() {
      try {
        const response = await fetch("http://localhost:8080/api/aeronaves");
        if (!response.ok) throw new Error("Erro ao buscar aeronaves");
        aeronavesCarregadas = await response.json();
        const selectAeronave = document.getElementById("filtro-aeronave");
        aeronavesCarregadas.forEach(a => {
          const option = document.createElement("option");
          option.value = a.matricula;
          option.textContent = a.modelo + " (" + a.matricula + ")";
          selectAeronave.appendChild(option);
        });
      } catch (error) {
        console.error(error);
      }
    }

    // Aplica filtros aos agendamentos carregados
    function aplicarFiltros() {
      const filtroInicio = document.getElementById("filtro-data-inicio").value;
      const filtroFim = document.getElementById("filtro-data-fim").value;
      const filtroAluno = document.getElementById("filtro-aluno").value;
      const filtroInstrutor = document.getElementById("filtro-instrutor").value;
      const filtroAeronave = document.getElementById("filtro-aeronave").value;
      const filtroTipo = document.getElementById("filtro-tipo-voo").value;

      const lista = document.getElementById("agendamentos-list");
      lista.innerHTML = "";

      let filtrados = agendamentosCarregados.filter(ag => {
        const dataAg = new Date(ag.horario_partida);

        if (filtroInicio && dataAg < new Date(filtroInicio)) return false;
        if (filtroFim && dataAg > new Date(filtroFim)) return false;
        if (filtroAluno && ag.aluno?.cpf !== filtroAluno) return false;
        if (filtroInstrutor && ag.instrutor?.cpf !== filtroInstrutor) return false;
        if (filtroAeronave && ag.aeronave?.matricula !== filtroAeronave) return false;
        if (filtroTipo && ag.tipo_voo !== filtroTipo) return false;

        return true;
      });

      if (filtrados.length === 0) {
        lista.innerHTML = "<li>Nenhum agendamento encontrado.</li>";
        return;
      }

      // Cria os itens da lista para cada agendamento filtrado
      filtrados.forEach(ag => {
        const data = new Date(ag.horario_partida);
        const dataFormatada = formatarDataHoraLocal(data);

        const item = document.createElement("li");
        item.innerHTML = `
          <span>${dataFormatada} - ${ag.aluno?.nome || "Aluno"} - ${ag.instrutor?.nome || "Instrutor"} - ${ag.aeronave?.modelo || "Aeronave"} - ${ag.tipo_voo || "Tipo não definido"} - ${ag.status || "Status"}</span>
          <div class="list-buttons">
            <button onclick="editarAgendamento('${ag.id}')">Editar</button>
            <button onclick="deletarAgendamento('${ag.id}')">Excluir</button>
          </div>
        `;
        lista.appendChild(item);
      });
    }

    // Redireciona para a página de edição do agendamento
    function editarAgendamento(id) {
      window.location.href = `adicionaragendamento.html?id=${id}`;
    }

    // Deleta um agendamento com confirmação
    async function deletarAgendamento(id) {
      Swal.fire({
        title: 'Tem certeza?',
        text: "O agendamento será deletado e você não poderá reverter esta ação!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#c00',
        cancelButtonColor: '#555',
        confirmButtonText: 'Sim, deletar',
        cancelButtonText: 'Cancelar'
      }).then(async (result) => {
        if (result.isConfirmed) {
          try {
            const response = await fetch(`http://localhost:8080/api/agendamentos/${id}`, { method: "DELETE" });
            if (response.ok) {
              Swal.fire({ title: 'Deletado!', text: 'O agendamento foi removido com sucesso.', icon: 'success', confirmButtonColor: '#c00' });
              carregarAgendamentos();
            } else {
              Swal.fire('Erro', 'Não foi possível excluir o agendamento.', 'error');
            }
          } catch (error) {
            console.error(error);
            Swal.fire('Erro', 'Falha de conexão com o servidor.', 'error');
          }
        }
      });
    }

    // Inicializa a página carregando alunos, instrutores, aeronaves e agendamentos
    async function inicializar() {
      await Promise.all([carregarAlunos(), carregarInstrutores(), carregarAeronaves()]);
      carregarAgendamentos();
    }

    inicializar();
  </script>
</body>
</html>
