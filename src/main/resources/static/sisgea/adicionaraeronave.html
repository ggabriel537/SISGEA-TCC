<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISGEA - Cadastro de Aeronave</title>
    <link rel="stylesheet" href="css/adicionar.css">
    <link rel="stylesheet" href="css/sweetalert.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="sidebar">
        <a href="inicio.html" id="inicial">
            <h1><img src="css/aviao.png" alt="Logo do Avião">SISGEA</h1>
        </a>
        <a href="agendamento.html">Agendamento</a>
        <a href="aeronave.html">Aeronave</a>
        <a href="aluno.html">Aluno</a>
        <a href="instrutor.html">Instrutor</a>
        <a href="manutencao.html">Manutenção</a>
        <a href="diario.html">Diário</a>
    </div>

    <div class="main">
        <h1 id="titulo">Cadastro de Aeronave</h1>
        <div class="container" id="aeronave">

            <label>Matrícula</label>
            <input type="text" id="matricula" placeholder="PT-ABC" maxlength="6" oninput="formatarMatricula(this)">

            <label>Modelo</label>
            <input type="text" id="modelo" placeholder="Modelo da aeronave" maxlength="32">

            <label>Fabricante</label>
            <input type="text" id="fabricante" placeholder="Fabricante da aeronave" maxlength="32">

            <label>Habilitação</label>
            <select id="habilitacao">
                <option value="">Selecione...</option>
                <option>MNTE</option>
                <option>MLTE</option>
                <option>MNAF</option>
            </select>

            <label>Tipo de Voo</label>
            <select id="tipo_de_voo">
                <option value="">Selecione...</option>
                <option>VFR-D</option>
                <option>VFR-N</option>
                <option>IFR</option>
            </select>

            <label>Horas de Voo</label>
            <input type="number" id="horas_de_voo" placeholder="Ex: 1200" min="0" step="0.1">

            <button id="btnCadastrar">Cadastrar Aeronave</button>
        </div>
    </div>

    <script>
        const baseUrl = 'http://localhost:8080/api';
        const urlParams = new URLSearchParams(window.location.search);
        const matriculaParam = urlParams.get('matricula'); // id para edição

        const matriculaInput = document.getElementById("matricula");
        const modeloInput = document.getElementById("modelo");
        const fabricanteInput = document.getElementById("fabricante");
        const habilitacaoSelect = document.getElementById("habilitacao");
        const tipoVooSelect = document.getElementById("tipo_de_voo");
        const horasInput = document.getElementById("horas_de_voo");
        const btnCadastrar = document.getElementById("btnCadastrar");

        // Formata matrícula enquanto digita
        function formatarMatricula(input) {
            let valor = input.value.toUpperCase().replace(/[^A-Z]/g, "");
            if (valor.length > 2) {
                valor = valor.slice(0, 2) + "-" + valor.slice(2, 5);
            }
            input.value = valor;
        }

        // Verifica se matrícula atende ao padrão
        function matriculaValida(matricula) {
            const regex = /^(PP|PT|PR|PS|PU)-[A-Z]{3}$/;
            return regex.test(matricula);
        }

        // Carrega aeronave para edição
        async function carregarAeronave(matricula) {
            try {
                const res = await fetch(`${baseUrl}/aeronaves/${matricula}`);
                if (!res.ok) throw new Error("Aeronave não encontrada");
                const aer = await res.json();

                document.getElementById("titulo").innerText = "Editar Aeronave";
                btnCadastrar.innerText = "Atualizar Aeronave";

                matriculaInput.value = aer.matricula;
                matriculaInput.disabled = true;
                modeloInput.value = aer.modelo;
                fabricanteInput.value = aer.fabricante;
                habilitacaoSelect.value = aer.habilitacao;
                tipoVooSelect.value = aer.tipo_de_voo;
                horasInput.value = aer.horas_de_voo;
            } catch (err) {
                Swal.fire("Erro", "Não foi possível carregar a aeronave.\n" + err, "error");
                console.error(err);
            }
        }

        if (matriculaParam) carregarAeronave(matriculaParam);

        // Cadastrar ou atualizar aeronave
        async function salvarAeronave() {
            const aeronave = {
                matricula: matriculaInput.value.trim().toUpperCase(),
                modelo: modeloInput.value.trim(),
                fabricante: fabricanteInput.value.trim(),
                habilitacao: habilitacaoSelect.value.trim(),
                tipo_de_voo: tipoVooSelect.value.trim(),
                horas_de_voo: parseFloat(horasInput.value) || 0,
                manutencoes: [],
                diarioBordos: []
            };

            // Validação
            if (!aeronave.matricula || !aeronave.modelo || !aeronave.fabricante || !aeronave.habilitacao || !aeronave.tipo_de_voo) {
                Swal.fire("Atenção", "Preencha todos os campos obrigatórios!", "warning");
                return;
            }
            if (!matriculaValida(aeronave.matricula)) {
                Swal.fire("Erro", "Matrícula inválida. Formato: XX-XXX e prefixo deve ser PP, PT, PR, PS ou PU.", "error");
                return;
            }

            const method = matriculaParam ? "PUT" : "POST";
            const url = matriculaParam ? `${baseUrl}/aeronaves/${matriculaParam}` : `${baseUrl}/aeronaves`;

            try {
                const res = await fetch(url, {
                    method,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(aeronave)
                });

                const data = await res.json();

                if (!res.ok) {
                    Swal.fire("Erro", data.error || "Falha ao salvar aeronave.", "error");
                    return;
                }

                Swal.fire("Sucesso", matriculaParam ? "Aeronave atualizada com sucesso!" : "Aeronave cadastrada com sucesso!", "success")
                    .then(() => window.location.href = "aeronave.html");

            } catch (err) {
                Swal.fire("Erro", "Não foi possível conectar à API.\n" + err, "error");
                console.error(err);
            }
        }

        btnCadastrar.addEventListener("click", salvarAeronave);
    </script>
</body>

</html>
