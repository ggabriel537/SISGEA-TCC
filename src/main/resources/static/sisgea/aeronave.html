<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISGEA - Aeronaves</title>
  <link rel="stylesheet" href="css/adicionar.css">
  <link rel="stylesheet" href="css/sweetalert.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <div class="sidebar">
    <a href="inicio.html" id="inicial">
      <h1><img src="css/aviao.png" alt="Logo do Avião">SISGEA</h1>
    </a>
    <a href="agendamento.html">Agendamento</a>
    <a href="aeronave.html">Aeronave</a>
    <a href="aluno.html">Aluno</a>
    <a href="instrutor.html">Instrutor</a>
    <a href="manutencao.html">Manutenção</a>
    <a href="diario.html">Diário</a>
  </div>

  <div class="main">
    <a class="add-button" href="adicionaraeronave.html">+</a>

    <h1>Lista de Aeronaves</h1>

    <div class="filtros">
      <label>Matrícula</label>
      <input type="text" id="filtro-matricula" placeholder="Digite a matrícula" oninput="aplicarFiltros()">

      <label>Modelo</label>
      <input type="text" id="filtro-modelo" placeholder="Digite o modelo" oninput="aplicarFiltros()">

      <label>Fabricante</label>
      <input type="text" id="filtro-fabricante" placeholder="Digite o fabricante" oninput="aplicarFiltros()">

      <label>Habilitação</label>
      <select id="filtro-habilitacao" onchange="aplicarFiltros()">
        <option value="">Selecione...</option>
        <option>MNTE</option>
        <option>MLTE</option>
        <option>MNAF</option>
      </select>

      <label>Tipo de Voo</label>
      <select id="filtro-tipo" onchange="aplicarFiltros()">
        <option value="">Selecione...</option>
        <option>VFR-D</option>
        <option>VFR-N</option>
        <option>IFR</option>
      </select>

      <label>Status</label>
      <select id="filtro-ativo" onchange="aplicarFiltros()">
        <option value="true">Somente Ativos</option>
        <option value="false">Somente Inativos</option>
        <option value="">Todos</option>
      </select>
    </div>
    <br><br>

    <div class="container" id="lista-aeronaves">
      <ul id="aeronaves-list"></ul>
    </div>
  </div>

  <script>
    // Lista aeronaves
    let aeronavesCarregadas = [];

    // Formata matrícula para o padrão XX-XXX
    function formatarMatricula(input) {
      let valor = input.value.toUpperCase().replace(/[^A-Z]/g, "");
      if (valor.length > 2) {
        valor = valor.slice(0, 2) + "-" + valor.slice(2, 5);
      }
      input.value = valor;
    }

    // Formata horas de voo
    function formatarHoras(horas) {
      return horas ? `${horas}h` : "0h";
    }

    // Carrega aeronaves do backend
    async function carregarAeronaves() {
      try {
        const response = await fetch("http://localhost:8080/api/aeronaves/todos");
        if (!response.ok) throw new Error("Erro ao buscar aeronaves");

        aeronavesCarregadas = await response.json();
        aplicarFiltros();
      } catch (error) {
        console.error(error);
        document.getElementById("aeronaves-list").innerHTML = "<li>Erro ao carregar aeronaves.</li>";
      }
    }

    // Aplica filtros às aeronaves carregadas
    function aplicarFiltros() {
      formatarMatricula(document.getElementById("filtro-matricula"));
      const filtroMatricula = document.getElementById("filtro-matricula").value.toLowerCase();
      const filtroModelo = document.getElementById("filtro-modelo").value.toLowerCase();
      const filtroFabricante = document.getElementById("filtro-fabricante").value.toLowerCase();
      const filtroHabilitacao = document.getElementById("filtro-habilitacao").value;
      const filtroTipo = document.getElementById("filtro-tipo").value;
      const filtroAtivo = document.getElementById("filtro-ativo").value;

      const lista = document.getElementById("aeronaves-list");
      lista.innerHTML = "";

      const filtradas = aeronavesCarregadas.filter(aer => {
        const matricula = aer.matricula?.toLowerCase() || "";
        const modelo = aer.modelo?.toLowerCase() || "";
        const fabricante = aer.fabricante?.toLowerCase() || "";
        const habilitacao = aer.habilitacao || "";
        const tipo = aer.tipo_de_voo || "";
        const ativo = aer.ativo !== undefined ? aer.ativo.toString() : "";

        if (filtroMatricula && !matricula.includes(filtroMatricula)) return false;
        if (filtroModelo && !modelo.includes(filtroModelo)) return false;
        if (filtroFabricante && !fabricante.includes(filtroFabricante)) return false;
        if (filtroHabilitacao && habilitacao !== filtroHabilitacao) return false;
        if (filtroTipo && tipo !== filtroTipo) return false;
        if (filtroAtivo && ativo !== filtroAtivo) return false;

        return true;
      });

      if (filtradas.length === 0) {
        lista.innerHTML = "<li>Nenhuma aeronave encontrada.</li>";
        return;
      }

      // Cria os itens da lista para cada aeronave filtrada
      filtradas.forEach(aer => {
        const item = document.createElement("li");
        item.innerHTML = `
          <span>
            ${aer.matricula || "Sem matrícula"} - ${aer.fabricante || "Sem Fabricante"} - ${aer.modelo || "Sem modelo"} - ${formatarHoras(aer.horas_de_voo)}
          </span>
          <div class="list-buttons">
            <button onclick="editarAeronave('${aer.matricula}')">Editar</button>
            ${
              aer.ativo
                ? `<button onclick="deletarAeronave('${aer.matricula}')">Excluir</button>`
                : `<button onclick="recuperarAeronave('${aer.matricula}')">Recuperar</button>`
            }
          </div>
        `;
        lista.appendChild(item);
      });
    }

    // Redireciona para a página de edição da aeronave
    function editarAeronave(matricula) {
      window.location.href = `adicionaraeronave.html?matricula=${matricula}`;
    }

    // Deleta uma aeronave com confirmação
    async function deletarAeronave(matricula) {
      Swal.fire({
        title: 'Tem certeza?',
        text: "A aeronave será excluída e você não poderá reverter esta ação!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#c00',
        cancelButtonColor: '#555',
        confirmButtonText: 'Sim, excluir',
        cancelButtonText: 'Cancelar'
      }).then(async (result) => {
        if (result.isConfirmed) {
          try {
            const response = await fetch(`http://localhost:8080/api/aeronaves/${matricula}`, { method: "DELETE" });
            if (response.ok) {
              Swal.fire({
                title: 'Excluída!',
                text: 'A aeronave foi removida com sucesso.',
                icon: 'success',
                confirmButtonColor: '#c00'
              });
              carregarAeronaves();
            } else {
              Swal.fire('Erro', 'Não foi possível excluir a aeronave.', 'error');
            }
          } catch (error) {
            console.error(error);
            Swal.fire('Erro', 'Falha de conexão com o servidor.', 'error');
          }
        }
      });
    }

    // Recupera aeronave (seta ativo = true)
    async function recuperarAeronave(matricula) {
      try {
        const response = await fetch(`http://localhost:8080/api/aeronaves/${matricula}`);
        if (!response.ok) throw new Error("Erro ao buscar aeronave");
        const aeronave = await response.json();

        aeronave.ativo = true;

        const update = await fetch(`http://localhost:8080/api/aeronaves/${matricula}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(aeronave)
        });

        if (update.ok) {
          Swal.fire("Sucesso", "Aeronave recuperada com sucesso!", "success")
            .then(() => carregarAeronaves());
        } else {
          Swal.fire("Erro", "Não foi possível recuperar a aeronave.", "error");
        }
      } catch (err) {
        console.error(err);
        Swal.fire("Erro", "Falha de conexão com o servidor.", "error");
      }
    }

    // Inicializa a página carregando as aeronaves
    carregarAeronaves();
  </script>
</body>
</html>
