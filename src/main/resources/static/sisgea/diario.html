<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISGEA - Diários de Bordo</title>
  <link rel="stylesheet" href="css/adicionar.css">
  <link rel="stylesheet" href="css/sweetalert.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="sidebar">
  <a href="inicio.html" id="inicial">
    <h1><img src="css/aviao.png" alt="Logo do Avião">SISGEA</h1>
  </a>
  <a href="agendamento.html">Agendamento</a>
  <a href="aeronave.html">Aeronave</a>
  <a href="aluno.html">Aluno</a>
  <a href="instrutor.html">Instrutor</a>
  <a href="manutencao.html">Manutenção</a>
  <a href="diario.html">Diário</a>
</div>

<div class="main">
  <a class="add-button" href="adicionar_diario.html">+</a>
  <h1>Lista de Diários de Bordo</h1>

  <div class="filtros">
    <label>Data Início:</label>
    <input type="date" id="filtro-data-inicio" onchange="aplicarFiltros()">

    <label>Data Fim:</label>
    <input type="date" id="filtro-data-fim" onchange="aplicarFiltros()">

    <label>Aeronave:</label>
    <select id="filtro-aeronave" onchange="aplicarFiltros()">
      <option value="">Todas</option>
    </select>

    <label>Origem:</label>
    <input type="text" id="filtro-origem" placeholder="Código do aeroporto" oninput="aplicarFiltros()">

    <label>Destino:</label>
    <input type="text" id="filtro-destino" placeholder="Código do aeroporto" oninput="aplicarFiltros()">

    <label>Instrutor:</label>
    <select id="filtro-instrutor" onchange="aplicarFiltros()">
      <option value="">Todos</option>
    </select>

    <label>Aluno:</label>
    <select id="filtro-aluno" onchange="aplicarFiltros()">
      <option value="">Todos</option>
    </select>
  </div>
  <br><br>

  <div class="container" id="lista-diarios">
    <ul id="diarios-list"></ul>
  </div>
</div>

<script>
  // Lista diários de bordo
let diariosCarregados = [];
let alunosCarregados = [];
let instrutoresCarregados = [];
let aeronavesCarregadas = [];

// Carrega diários do backend
async function carregarDiarios() {
  try {
    const res = await fetch("http://localhost:8080/api/diarios-bordo");
    if (!res.ok) throw new Error("Erro ao buscar diários");
    diariosCarregados = await res.json();
    aplicarFiltros();
  } catch (err) {
    console.error(err);
    document.getElementById("diarios-list").innerHTML = "<li>Erro ao carregar diários de bordo.</li>";
  }
}

// Carrega alunos, instrutores e aeronaves
async function carregarAlunos() {
  try {
    const res = await fetch("http://localhost:8080/api/alunos");
    if (!res.ok) throw new Error("Erro ao buscar alunos");
    alunosCarregados = await res.json();
    const select = document.getElementById("filtro-aluno");
    alunosCarregados.forEach(a => {
      const opt = document.createElement("option");
      opt.value = a.nome;
      opt.textContent = a.nome;
      select.appendChild(opt);
    });
  } catch (err) { console.error(err); }
}

async function carregarInstrutores() {
  try {
    const res = await fetch("http://localhost:8080/api/instrutores");
    if (!res.ok) throw new Error("Erro ao buscar instrutores");
    instrutoresCarregados = await res.json();
    const select = document.getElementById("filtro-instrutor");
    instrutoresCarregados.forEach(i => {
      const opt = document.createElement("option");
      opt.value = i.nome;
      opt.textContent = i.nome;
      select.appendChild(opt);
    });
  } catch (err) { console.error(err); }
}

async function carregarAeronaves() {
  try {
    const res = await fetch("http://localhost:8080/api/aeronaves");
    if (!res.ok) throw new Error("Erro ao buscar aeronaves");
    aeronavesCarregadas = await res.json();
    const select = document.getElementById("filtro-aeronave");
    aeronavesCarregadas.forEach(a => {
      const opt = document.createElement("option");
      opt.value = a.matricula;
      opt.textContent = `${a.modelo} (${a.matricula})`;
      select.appendChild(opt);
    });
  } catch (err) { console.error(err); }
}

// Aplica filtros aos diários carregados
function aplicarFiltros() {
  const fInicio = document.getElementById("filtro-data-inicio").value;
  const fFim = document.getElementById("filtro-data-fim").value;
  const fAeronave = document.getElementById("filtro-aeronave").value;
  const fOrigem = document.getElementById("filtro-origem").value.toUpperCase();
  const fDestino = document.getElementById("filtro-destino").value.toUpperCase();
  const fInstrutor = document.getElementById("filtro-instrutor").value;
  const fAluno = document.getElementById("filtro-aluno").value;

  const lista = document.getElementById("diarios-list");
  lista.innerHTML = "";

  const filtrados = diariosCarregados.filter(d => {
    const data = new Date(d.data);
    if (fInicio && data < new Date(fInicio)) return false;
    if (fFim && data > new Date(fFim)) return false;
    if (fAeronave && d.aeronaveId !== fAeronave) return false;
    if (fOrigem && !d.localDecolagem.toUpperCase().includes(fOrigem)) return false;
    if (fDestino && !d.localPouso.toUpperCase().includes(fDestino)) return false;

    const nomeInstrutor = instrutoresCarregados.find(i => i.cpf === d.instrutorId)?.nome || "";
    const nomeAluno = alunosCarregados.find(a => a.cpf === d.alunoId)?.nome || "";

    if (fInstrutor && nomeInstrutor !== fInstrutor) return false;
    if (fAluno && nomeAluno !== fAluno) return false;

    return true;
  });

  if (filtrados.length === 0) {
    lista.innerHTML = "<li>Nenhum diário de bordo encontrado.</li>";
    return;
  }

  // Cria os itens da lista para cada diário filtrado
  filtrados.forEach(d => {
    const data = new Date(d.data);
    const dataFormatada = data.toLocaleDateString("pt-BR");
    const decolagem = d.localDecolagem || "-";
    const pouso = d.localPouso || "-";

    const nomeAluno = alunosCarregados.find(a => a.cpf === d.alunoId)?.nome || "Aluno";
    const nomeInstrutor = instrutoresCarregados.find(i => i.cpf === d.instrutorId)?.nome || "Instrutor";

    const item = document.createElement("li");
    item.innerHTML = `
      <span>${dataFormatada} - ${nomeAluno} / ${nomeInstrutor} - ${decolagem} → ${pouso} - ${d.aeronaveId}</span>
      <div class="list-buttons">
        <button onclick="editarDiario('${d.id}')">Editar</button>
        <button onclick="deletarDiario('${d.id}')">Excluir</button>
      </div>
    `;
    lista.appendChild(item);
  });
}

// Redireciona para a página de edição do diário
function editarDiario(id) {
  window.location.href = `adicionar_diario.html?id=${id}`;
}

// Deleta um diário com confirmação
async function deletarDiario(id) {
  Swal.fire({
    title: 'Tem certeza?',
    text: "O diário será deletado e não poderá ser recuperado!",
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Sim, deletar',
    cancelButtonText: 'Cancelar'
  }).then(async result => {
    if (result.isConfirmed) {
      try {
        const res = await fetch(`http://localhost:8080/api/diarios-bordo/${id}`, { method: "DELETE" });
        if (res.ok) {
          Swal.fire("Deletado!", "O diário de bordo foi removido.", "success");
          carregarDiarios();
        } else {
          Swal.fire("Erro", "Não foi possível deletar o diário.", "error");
        }
      } catch (err) {
        console.error(err);
        Swal.fire("Erro", "Falha de conexão com o servidor.", "error");
      }
    }
  });
}

// Inicializa a página carregando dados necessários
async function inicializar() {
  await Promise.all([carregarAlunos(), carregarInstrutores(), carregarAeronaves()]);
  carregarDiarios();
}

inicializar();
</script>

</body>
</html>
