<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISGEA - Cadastro de Aluno</title>
  <link rel="stylesheet" href="css/adicionar.css">
  <link rel="stylesheet" href="css/sweetalert.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <div class="sidebar">
    <a href="inicio.html" id="inicial">
      <h1><img src="css/aviao.png" alt="Logo do Avião">SISGEA</h1>
    </a>
    <a href="agendamento.html">Agendamento</a>
    <a href="aeronave.html">Aeronave</a>
    <a href="aluno.html">Aluno</a>
    <a href="instrutor.html">Instrutor</a>
    <a href="manutencao.html">Manutenção</a>
    <a href="diario.html">Diário</a>
  </div>

  <div class="main">
    <h1 id="titulo">Cadastro de Aluno</h1>
    <div class="container" id="aluno">

      <label>Nome</label>
      <input type="text" id="nome" placeholder="Nome completo" maxlength="64">

      <label>CPF</label>
      <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)">

      <label>CANAC</label>
      <input type="text" id="canac" placeholder="000000" maxlength="6" oninput="apenasNumeros(this)">

      <label>E-mail</label>
      <input type="email" id="email" placeholder="exemplo@email.com" maxlength="50">

      <label>Curso</label>
      <select id="curso">
        <option value="">Selecione...</option>
        <option>Piloto Privado</option>
        <option>Piloto Comercial</option>
        <option>Piloto Comercial / IFR</option>
        <option>Instrutor de Voo</option>
        <option>IFR</option>
      </select>

      <label>Horas Compradas</label>
      <input type="number" id="horasCompradas" placeholder="0" min="0" step="0.1">

      <label>Horas Voadas</label>
      <input type="number" id="horasVoadas" placeholder="0" min="0" step="0.1">

      <label>Telefone</label>
      <input type="tel" id="telefone" placeholder="(00) 90000-0000" maxlength="15" oninput="mascaraTelefone(this)">

      <h3>Endereço</h3>
      <label>CEP</label>
      <input type="text" id="cep" placeholder="01001-000" maxlength="9" oninput="mascaraCEP(this)">

      <label>Cidade</label>
      <input type="text" id="cidade" placeholder="Cidade" maxlength="32" readonly>

      <label>Estado</label>
      <input type="text" id="estado" placeholder="Estado" maxlength="32" readonly>

      <label>Logradouro</label>
      <input type="text" id="logradouro" placeholder="Rua, Avenida, etc..." maxlength="64">

      <label>Número</label>
      <input type="text" id="numero" placeholder="Número" maxlength="8">

      <label>Complemento</label>
      <input type="text" id="complemento" placeholder="Apartamento, Casa, etc..." maxlength="32">

      <label>Bairro</label>
      <input type="text" id="bairro" placeholder="Bairro" maxlength="64">

      <button id="botao" onclick="cadastrarAluno()">Cadastrar Aluno</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const cpfEdit = urlParams.get('cpf');
    if(cpfEdit) carregarAluno(cpfEdit);

    // Máscara CPF
    function mascaraCPF(input) {
      let v = input.value.replace(/\D/g, "").slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      input.value = v;
    }

    // Permite apenas números
    function apenasNumeros(input) {
      input.value = input.value.replace(/\D/g, "");
    }

    // Máscara Telefone
    function mascaraTelefone(input) {
      let v = input.value.replace(/\D/g, "").slice(0, 11);
      v = v.replace(/(\d{2})(\d)/, "($1) $2");
      v = v.replace(/(\d{5})(\d{1,4})$/, "$1-$2");
      input.value = v;
    }

    // Máscara CEP e busca endereço
    function mascaraCEP(input) {
      let v = input.value.replace(/\D/g, "").slice(0, 8);
      v = v.replace(/(\d{5})(\d)/, "$1-$2");
      input.value = v;
      if(v.length === 9) buscarCep();
    }

    // Busca endereço via API do ViaCEP
    function buscarCep() {
      const cep = document.getElementById("cep").value.replace(/\D/g,"");
      if(cep.length === 8){
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
          .then(r => r.json())
          .then(data => {
            if(data.erro){
              Swal.fire("Erro","CEP não encontrado!","error");
            }else{
              document.getElementById("cidade").value = data.localidade||"";
              document.getElementById("estado").value = data.uf||"";
              document.getElementById("logradouro").value = data.logradouro||"";
              document.getElementById("bairro").value = data.bairro||"";
            }
          }).catch(err=>{
            Swal.fire("Erro","Não foi possível buscar o CEP.","error");
            console.error(err);
          });
      }
    }

    // Valida CPF
    function validarCPF(cpf) {
      cpf = cpf.replace(/\D/g, "");
      
      // Verifica se tem 11 dígitos
      if (cpf.length !== 11) return false;
      
      // Verifica se todos os dígitos são iguais
      if (/^(\d)\1{10}$/.test(cpf)) return false;
      
      // Calcula primeiro dígito verificador
      let soma = 0;
      let multiplicador = 10;
      for (let i = 0; i < 9; i++) {
        soma += parseInt(cpf[i]) * multiplicador;
        multiplicador--;
      }
      let resto = soma % 11;
      let primeiroDigito = resto < 2 ? 0 : 11 - resto;
      
      if (parseInt(cpf[9]) !== primeiroDigito) return false;
      
      // Calcula segundo dígito verificador
      soma = 0;
      multiplicador = 11;
      for (let i = 0; i < 10; i++) {
        soma += parseInt(cpf[i]) * multiplicador;
        multiplicador--;
      }
      resto = soma % 11;
      let segundoDigito = resto < 2 ? 0 : 11 - resto;
      
      if (parseInt(cpf[10]) !== segundoDigito) return false;
      
      return true;
    }

    // Limpa máscaras para enviar ao DB
    function limparMascaraCPF(cpf){ return cpf.replace(/\D/g,""); }
    function limparMascaraTelefone(tel){ return tel.replace(/\D/g,""); }

    async function cadastrarAluno(forcar=false){
      const aluno = {
        nome: document.getElementById("nome").value.trim(),
        cpf: limparMascaraCPF(document.getElementById("cpf").value).trim(),
        canac: document.getElementById("canac").value.trim(),
        email: document.getElementById("email").value.trim(),
        curso: document.getElementById("curso").value.trim(),
        horas_compradas: parseFloat(document.getElementById("horasCompradas").value)||0,
        horas_voadas: parseFloat(document.getElementById("horasVoadas").value)||0,
        telefone: limparMascaraTelefone(document.getElementById("telefone").value).trim(),
        endereco:{
          cep: document.getElementById("cep").value.trim(),
          cidade: document.getElementById("cidade").value.trim(),
          estado: document.getElementById("estado").value.trim(),
          logradouro: document.getElementById("logradouro").value.trim(),
          numero: document.getElementById("numero").value.trim(),
          complemento: document.getElementById("complemento").value.trim(),
          bairro: document.getElementById("bairro").value.trim()
        },
        ativo: true
      };

      // Validações
      if(!aluno.nome || !aluno.cpf || !aluno.canac){
        Swal.fire("Atenção","Preencha Nome, CPF e CANAC!","warning");
        return;
      }

      if(!validarCPF(aluno.cpf)){
        Swal.fire("Atenção","CPF inválido! Verifique o número digitado.","warning");
        return;
      }

      const method = cpfEdit ? "PUT" : "POST";
      const endpoint = cpfEdit ? `http://localhost:8080/api/alunos/${cpfEdit}?forcar=${forcar}` 
                               : `http://localhost:8080/api/alunos?forcar=${forcar}`;

      try {
        const res = await fetch(endpoint,{
          method,
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify(aluno)
        });
        const data = await res.json();

        if(!res.ok){
          Swal.fire("Erro", data.error || "Falha ao cadastrar aluno.","error");
          return;
        }

        if(data.warn){
          Swal.fire({
            title:"Atenção",
            text:data.warn,
            icon:"warning",
            showCancelButton:true,
            confirmButtonText:"Confirmar mesmo assim",
            cancelButtonText:"Cancelar"
          }).then(result=>{
            if(result.isConfirmed) cadastrarAluno(true);
          });
          return;
        }

        if(data.status === "sucesso"){
          Swal.fire("Sucesso",cpfEdit ? "Aluno atualizado com sucesso!" : "Aluno cadastrado com sucesso!","success")
            .then(()=> window.location.href="aluno.html");
        }

      }catch(error){
        Swal.fire("Erro","Não foi possível conectar à API.","error");
        console.error(error);
      }
    }

    // Carrega dados do aluno para edição
    async function carregarAluno(cpf){
  try{
    const res = await fetch(`http://localhost:8080/api/alunos/${cpf}`);
    if(!res.ok) throw new Error("Aluno não encontrado");
    const aluno = await res.json();

    document.getElementById("titulo").innerText = "Edição de Aluno";
    document.getElementById("botao").innerText = "Atualizar Aluno";

    document.getElementById("nome").value = aluno.nome || "";
    document.getElementById("cpf").value = aluno.cpf || "";
    document.getElementById("canac").value = aluno.canac || "";
    document.getElementById("email").value = aluno.email || "";
    document.getElementById("curso").value = aluno.curso || "";
    document.getElementById("horasCompradas").value = aluno.horas_compradas || 0;
    document.getElementById("horasVoadas").value = aluno.horas_voadas || 0;
    document.getElementById("telefone").value = aluno.telefone || "";
    if(aluno.endereco){
      document.getElementById("cep").value = aluno.endereco.cep || "";
      document.getElementById("cidade").value = aluno.endereco.cidade || "";
      document.getElementById("estado").value = aluno.endereco.estado || "";
      document.getElementById("logradouro").value = aluno.endereco.logradouro || "";
      document.getElementById("numero").value = aluno.endereco.numero || "";
      document.getElementById("complemento").value = aluno.endereco.complemento || "";
      document.getElementById("bairro").value = aluno.endereco.bairro || "";
    }

    // Tornar campos CPF e CANAC readonly
    document.getElementById("cpf").readOnly = true;
    document.getElementById("canac").readOnly = true;

    // Aplicar máscaras nos campos carregados
    mascaraCPF(document.getElementById("cpf"));
    mascaraTelefone(document.getElementById("telefone"));
    mascaraCEP(document.getElementById("cep"));

  }catch(error){
    Swal.fire("Erro","Não foi possível carregar os dados do aluno.","error");
    console.error(error);
  }
}

  </script>
</body>
</html>
