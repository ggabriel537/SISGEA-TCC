<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISGEA - Cadastro de Instrutor</title>
  <link rel="stylesheet" href="css/adicionar.css">
  <link rel="stylesheet" href="css/sweetalert.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <div class="sidebar">
    <a href="inicio.html" id="inicial">
      <h1><img src="css/aviao.png" alt="Logo do Avião">SISGEA</h1>
    </a>
    <a href="agendamento.html">Agendamento</a>
    <a href="aeronave.html">Aeronave</a>
    <a href="aluno.html">Aluno</a>
    <a href="instrutor.html">Instrutor</a>
    <a href="manutencao.html">Manutenção</a>
    <a href="diario.html">Diário</a>
  </div>

  <div class="main">
    <h1 id="titulo">Cadastro de Instrutor</h1>
    <div class="container" id="instrutor">

      <label>Nome</label>
      <input type="text" id="nome" placeholder="Nome completo" maxlength="64">

      <label>CPF</label>
      <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)">

      <label>CANAC</label>
      <input type="text" id="canac" placeholder="000000" maxlength="6" oninput="apenasNumeros(this)">

      <label>E-mail</label>
      <input type="email" id="email" placeholder="exemplo@email.com" maxlength="50">

      <label>Habilitação</label>
      <select id="habilitacao">
        <option value="">Selecione...</option>
        <option>INVA (Instrutor de Voo)</option>
        <option>PLA (Piloto de Linha Aérea)</option>
        <option>PC (Piloto Comercial)</option>
      </select>

      <label>Telefone</label>
      <input type="tel" id="telefone" placeholder="(00) 90000-0000" maxlength="15" oninput="mascaraTelefone(this)">

      <h3>Endereço</h3>
      <label>CEP</label>
      <input type="text" id="cep" placeholder="01001-000" maxlength="9" oninput="mascaraCEP(this)">

      <label>Cidade</label>
      <input type="text" id="cidade" placeholder="Cidade" maxlength="32" readonly>

      <label>Estado</label>
      <input type="text" id="estado" placeholder="Estado" maxlength="32" readonly>

      <label>Logradouro</label>
      <input type="text" id="logradouro" placeholder="Rua, Avenida, etc..." maxlength="64">

      <label>Número</label>
      <input type="text" id="numero" placeholder="Número" maxlength="8">

      <label>Complemento</label>
      <input type="text" id="complemento" placeholder="Apartamento, Casa, etc..." maxlength="32">

      <label>Bairro</label>
      <input type="text" id="bairro" placeholder="Bairro" maxlength="64">

      <h3>Dados do Usuário</h3>
      <label>Usuário</label>
      <input type="text" id="usuario" placeholder="Login no sistema" maxlength="16">

      <label>Senha</label>
      <input type="password" id="senha" placeholder="Senha de acesso" maxlength="16">

      <button id="botao" onclick="cadastrarInstrutor()">Cadastrar Instrutor</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const cpfEdit = urlParams.get('cpf');
    let usuarioAnterior = ""; // guarda usuário antigo
    let senhaAnterior = "";   // guarda senha antiga
    if (cpfEdit) carregarInstrutor(cpfEdit);

    // Máscara de CPF
    function mascaraCPF(input) {
      let valor = input.value.replace(/\D/g, ""); // só números
      if (valor.length > 11) valor = valor.slice(0, 11); // limita a 11 dígitos
      let cpfFormatado = valor
        .replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      input.value = cpfFormatado;
    }

    // Apenas números
    function apenasNumeros(input) {
      input.value = input.value.replace(/\D/g, "");
    }

    // Máscara de telefone
    function mascaraTelefone(input) {
      let valor = input.value.replace(/\D/g, "");
      if (valor.length > 11) valor = valor.slice(0, 11);
      let telefoneFormatado = valor
        .replace(/(\d{2})(\d)/, "($1) $2")
        .replace(/(\d{5})(\d{1,4})$/, "$1-$2");
      input.value = telefoneFormatado;
    }

    // Máscara de CEP
    function mascaraCEP(input) {
      let valor = input.value.replace(/\D/g, ""); // só números
      if (valor.length > 8) valor = valor.slice(0, 8); // limita a 8 dígitos
      let cepFormatado = valor.replace(/(\d{5})(\d)/, "$1-$2");
      input.value = cepFormatado;
      if (input.value.length === 9) {
        buscarCep();
      }
    }

    // Buscar CEP no ViaCEP
    function buscarCep() {
      const cep = document.getElementById("cep").value.replace(/\D/g, ""); // remove caracteres não numéricos
      if (cep.length === 8) {
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
          .then(response => response.json())
          .then(data => {
            if (data.erro) {
              Swal.fire("Erro", "CEP não encontrado!", "error");
            } else {
              document.getElementById("cidade").value = data.localidade || "";
              document.getElementById("estado").value = data.uf || "";
              document.getElementById("logradouro").value = data.logradouro || "";
              document.getElementById("bairro").value = data.bairro || "";
            }
          })
          .catch(error => {
            Swal.fire("Erro", `Não foi possível buscar o CEP.\n${error}`, "error");
            console.error(error);
          });
      }
    }

    // Valida CPF
    function validarCPF(cpf) {
      cpf = cpf.replace(/\D/g, "");
      
      // Verifica se tem 11 dígitos
      if (cpf.length !== 11) return false;
      
      // Verifica se todos os dígitos são iguais
      if (/^(\d)\1{10}$/.test(cpf)) return false;
      
      // Calcula primeiro dígito verificador
      let soma = 0;
      let multiplicador = 10;
      for (let i = 0; i < 9; i++) {
        soma += parseInt(cpf[i]) * multiplicador;
        multiplicador--;
      }
      let resto = soma % 11;
      let primeiroDigito = resto < 2 ? 0 : 11 - resto;
      
      if (parseInt(cpf[9]) !== primeiroDigito) return false;
      
      // Calcula segundo dígito verificador
      soma = 0;
      multiplicador = 11;
      for (let i = 0; i < 10; i++) {
        soma += parseInt(cpf[i]) * multiplicador;
        multiplicador--;
      }
      resto = soma % 11;
      let segundoDigito = resto < 2 ? 0 : 11 - resto;
      
      if (parseInt(cpf[10]) !== segundoDigito) return false;
      
      return true;
    }

    // Remove máscaras antes de enviar
    function limparMascaraCPF(cpf) {
      return cpf.replace(/\D/g, "");
    }
    function limparMascaraTelefone(valor) {
      return valor.replace(/\D/g, "");
    }

    // Cadastrar ou atualizar instrutor
    async function cadastrarInstrutor(forcar = false) {
      const usuarioInput = document.getElementById("usuario").value.trim();
      const senhaInput = document.getElementById("senha").value.trim();

      const instrutor = {
        nome: document.getElementById("nome").value.trim(),
        cpf: limparMascaraCPF(document.getElementById("cpf").value).trim(),
        canac: document.getElementById("canac").value.trim(),
        email: document.getElementById("email").value.trim(),
        habilitacao: document.getElementById("habilitacao").value.trim(),
        telefone: limparMascaraTelefone(document.getElementById("telefone").value).trim(),
        endereco: {
          cep: document.getElementById("cep").value.trim(),
          cidade: document.getElementById("cidade").value.trim(),
          uf: document.getElementById("estado").value.trim(),
          logradouro: document.getElementById("logradouro").value.trim(),
          numero: document.getElementById("numero").value.trim(),
          complemento: document.getElementById("complemento").value.trim(),
          bairro: document.getElementById("bairro").value.trim()
        },
        ativo: true
      };

      if (!cpfEdit) {
        instrutor.usuario = {
          usuario: usuarioInput,
          senha: senhaInput,
          permissao: 0
        };
      } else {
        instrutor.usuario = {
          usuario: usuarioAnterior,
          senha: senhaInput,
          permissao: 0
        };
      }

      if (!instrutor.nome || !instrutor.cpf || !instrutor.usuario || !instrutor.usuario.senha) {
        Swal.fire("Atenção", "Preencha todos os campos obrigatórios!", "warning");
        return;
      }

      if (!validarCPF(instrutor.cpf)) {
        Swal.fire("Atenção", "CPF inválido! Verifique o número digitado.", "warning");
        return;
      }

      const method = cpfEdit ? "PUT" : "POST";
      const endpoint = cpfEdit ? `http://localhost:8080/api/instrutores/${cpfEdit}?forcar=${forcar}`
        : `http://localhost:8080/api/instrutores?forcar=${forcar}`;

      try {
        const res = await fetch(endpoint, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(instrutor)
        });
        const data = await res.json();

        if (!res.ok) {
          Swal.fire("Erro", data.error || "Falha ao cadastrar instrutor.", "error");
          return;
        }

        if (data.warn) {
          Swal.fire({
            title: "Atenção",
            text: data.warn,
            icon: "warning",
            showCancelButton: true,
            confirmButtonText: "Confirmar mesmo assim",
            cancelButtonText: "Cancelar"
          }).then(result => {
            if (result.isConfirmed) cadastrarInstrutor(true);
          });
          return;
        }

        if (data.status === "sucesso") {
          Swal.fire("Sucesso", cpfEdit ? "Instrutor atualizado com sucesso!" : "Instrutor cadastrado com sucesso!", "success")
            .then(() => window.location.href = "instrutor.html");
        }

      } catch (error) {
        Swal.fire("Erro", "Não foi possível conectar à API.", "error");
        console.error(error);
      }
    }

    async function carregarInstrutor(cpf) {
      try {
        const res = await fetch(`http://localhost:8080/api/instrutores/${cpf}`);
        if (!res.ok) throw new Error("Instrutor não encontrado");
        const instrutor = await res.json();

        document.getElementById("titulo").innerText = "Edição de Instrutor";
        document.getElementById("botao").innerText = "Atualizar Instrutor";

        document.getElementById("nome").value = instrutor.nome || "";
        document.getElementById("cpf").value = instrutor.cpf || "";
        document.getElementById("canac").value = instrutor.canac || "";
        document.getElementById("email").value = instrutor.email || "";
        document.getElementById("habilitacao").value = instrutor.habilitacao || "";
        document.getElementById("telefone").value = instrutor.telefone || "";
        if (instrutor.endereco) {
          document.getElementById("cep").value = instrutor.endereco.cep || "";
          document.getElementById("cidade").value = instrutor.endereco.cidade || "";
          document.getElementById("estado").value = instrutor.endereco.uf || "";
          document.getElementById("logradouro").value = instrutor.endereco.logradouro || "";
          document.getElementById("numero").value = instrutor.endereco.numero || "";
          document.getElementById("complemento").value = instrutor.endereco.complemento || "";
          document.getElementById("bairro").value = instrutor.endereco.bairro || "";
        }

        // Guardar usuário antigo
        if (instrutor.usuario) {
          usuarioAnterior = instrutor.usuario.usuario || "";
          document.getElementById("usuario").value = usuarioAnterior;
          document.getElementById("usuario").readOnly = true;
          document.getElementById("senha").value = "";
        }

        // Tornar campos CPF e CANAC readonly
        document.getElementById("cpf").readOnly = true;
        document.getElementById("canac").readOnly = true;

        // Aplicar máscaras nos campos carregados
        mascaraCPF(document.getElementById("cpf"));
        mascaraTelefone(document.getElementById("telefone"));
        mascaraCEP(document.getElementById("cep"));

      } catch (error) {
        Swal.fire("Erro", "Não foi possível carregar os dados do instrutor.", "error");
        console.error(error);
      }
    }
  </script>


</body>

</html>
