<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISGEA - Erro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 50px;
      text-align: center;
    }

    .error-title {
      font-size: 48px;
      font-weight: bold;
      color: #b00020;
      margin-bottom: 20px;
    }

    .error-message {
      font-size: 20px;
      color: #333;
      margin-bottom: 30px;
    }

    .error-actions a {
      display: inline-block;
      padding: 12px 24px;
      background-color: #b00020;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s, transform 0.3s;
    }

    .error-actions a:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="error-container">
      <div class="error-title">⚠️ Erro</div>
      <div class="error-message" id="error-message"></div>
      <div class="error-actions" id="error-actions"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    const messageElement = document.getElementById("error-message");
    const actionsElement = document.getElementById("error-actions");

    if (code === "403") {
      messageElement.textContent = "Você não tem permissão para acessar esta página.";
      actionsElement.innerHTML = `<a href="login.html">Voltar ao Login</a>`;
    } else if (code === "404") {
      messageElement.textContent = "A página que você tentou acessar não existe.";
      actionsElement.innerHTML = `<a href="inicio.html">Voltar ao Início</a>`;
    } else {
      messageElement.textContent = "Ocorreu um erro inesperado.";
      actionsElement.innerHTML = `<a href="login.html">Voltar ao Login</a>`;
    }
  </script>

</body>
</html>
